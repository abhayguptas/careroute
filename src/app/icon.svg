<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d8e87" /> <!-- from-brand-light roughly hsl(175, 40%, 40%) -->
      <stop offset="100%" stop-color="#2e6b66" /> <!-- to-brand roughly hsl(175, 40%, 30%) -->
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="120" height="120" rx="30" fill="url(#brandGrad)" filter="url(#shadow)" />

  <!-- Heart Pulse Icon (Scaled up and centered) -->
  <g transform="translate(24, 24) scale(3)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
