<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;display=swap');
      .text-care { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 56px; fill: #FFFFFF; }
      .text-route { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 56px; fill: #10B981; }
    </style>
  </defs>
  
  <!-- Background transparent -->
  <rect width="400" height="100" fill="transparent"/>
  
  <!-- Mark -->
  <g transform="translate(10, 10) scale(0.8)">
    <path d="M 65 25 A 35 35 0 1 0 65 75" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round"/>
    <path d="M 35 50 L 65 50" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round"/>
    <circle cx="85" cy="50" r="10" fill="#E11D48"/>
  </g>
  
  <!-- Wordmark -->
  <text x="110" y="70" class="text-care">Care</text>
  <text x="245" y="70" class="text-route">Route</text>
</svg>
