<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7850" />
      <stop offset="100%" stop-color="#2D9A7A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="400" height="120" fill="transparent"/>

  <!-- Mark -->
  <g transform="translate(10, 0)">
    <g filter="url(#shadow)">
      <path d="M 30 60 C 30 40, 50 30, 70 45 C 90 60, 90 80, 70 80 C 50 80, 50 60, 70 45" fill="none" stroke="url(#brandGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="60" r="7" fill="#1B7850"/>
      <circle cx="70" cy="80" r="7" fill="#2D9A7A"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(120, 78)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="52" fill="#1A1A1A" letter-spacing="-1">Care</text>
    <text x="122" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="300" font-size="52" fill="#1B7850" letter-spacing="-1">Route</text>
  </g>
</svg>
